name: CUDA 13.2 Test

on:
  push:
    branches:
      - master
    paths:
      - "SDKs/find_NVIDIA_CUDA.py"
      - "SDKs/refs/_findCUDA.py"
      - "include/template_nvidia_cuda_toolkit.py"

      - ".github/workflows/vs2026-nvda-test.yaml"
      - ".ci/compile/test-nvda.psm1"

  pull_request:
    branches:
      - master
    paths:
      - "SDKs/**/*NVIDIA_CUDA*"
      - "include/**/*nvidia_cuda*"
      - "include/template_nvidia_cuda_toolkit.py"

      - ".github/workflows/vs2026-nvda-test.yaml"
      - ".ci/compile/test-nvda.psm1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs2026-nvda-cuda132-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-test:
    name: VS2026 / NVIDIA CUDA 13.2
    runs-on: windows-2025
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    env:
      PYTHON_VERSION: "3.14.2"

      VS_MODULE: "vs/2026/Enterprise"
      MSVC_MODULE: "msvc/v145_14.51.36231/x64"
      UCRT_MODULE: "ucrt/10.0.26100.0"
      CUDA_MODULE: "nvidia/cuda/13.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install WEMI runtime dependencies
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk `
            -Everything `
            -EverythingCli

      - name: Start Everything
        run: |
          .\.ci\common\start-everything.ps1

      - name: Install NVIDIA CUDA 13.2
        run: |
          Import-Module `
            .\.ci\common\winget-functions.psm1 `
            -Force

          Test-Winget
          Install-CUDA132

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          github-token: ${{ github.token }}
          enable-cache: true
          cache-python: true

      - name: Configure, build and install WEMI
        run: |
          uv venv .venv `
            --python $env:PYTHON_VERSION `
            --seed

          . .\.venv\Scripts\Activate.ps1

          $InstallPrefix = "$env:RUNNER_TEMP\wemi-vs2026-cuda132"

          python.exe .\wemi.py `
            configure `
            --aio `
            --sdk='VS20XX;UCRT;CUDA' `
            --prefix="$InstallPrefix"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "WEMI_MODULES_PREFIX=$InstallPrefix" >> $env:GITHUB_ENV

      - name: Validate CUDA 13.2 module stack
        run: |
          Import-Module .\.ci\compile\test-nvda.psm1 -Force

          test-nvda `
            -Case Environment `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE `
            -CudaModule $env:CUDA_MODULE

      - name: CUDA host - compile, link and execute
        run: |
          Import-Module .\.ci\compile\test-nvda.psm1 -Force

          test-nvda `
            -Case NVCC `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE `
            -CudaModule $env:CUDA_MODULE
