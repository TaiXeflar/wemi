name: Generic Python Version Test

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test
        required: true
        type: string

      experimental:
        description: Allow this Python version to fail
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ inputs.python-version }}
    runs-on: windows-2025
    continue-on-error: ${{ inputs.experimental }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Tcl/Tk
        shell: pwsh
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk

      - name: Install Everything
        shell: pwsh
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -Everything

      - name: Install Everything CLI
        shell: pwsh
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -EverythingCli

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ inputs.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-cache: true
          cache-python: true

      - name: Run WEMI AIO test
        shell: pwsh
        run: |
          .\.ci\python-test\python-version-test.ps1 `
            -RepositoryRoot "${{ github.workspace }}" `
            -PythonVersion "${{ inputs.python-version }}"
