name: MSVC v145 Test

on:
  push:
    branches:
      - master
    paths:
      - "wemi.py"
      - "version.json"
      - "utils/**"
      - 'tasks/**'
      - 'SDKs/addM_Modules.py'
      - 'SDKs/refs/_find_SDK.py'
      - 'include/template_modulefile.py'
      - 'include/refs/_template.py'
      - 'devices/**'
      - 'version.json'

      - "SDKs/find_VS20XX.py"
      - "SDKs/find_UCRT.py"
      - "SDKs/refs/_findVS20XX.py"
      - "include/**/*VS20XX*"
      - "include/**/*ucrt*"

      - ".github/workflows/vs2026-msvc-v145.yaml"
      - ".ci/compile/test-msvc.psm1"


  pull_request:
    branches:
      - master
    paths:
      - "SDKs/**/*VS20XX*"
      - "SDKs/**/*UCRT*"
      - "include/**/*VS20XX*"
      - "include/**/*ucrt*"

      - ".github/workflows/vs2026-msvc-v145.yaml"
      - ".ci/compile/test-msvc.psm1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs2026-msvc-v145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-test:
    name: VS2026 Enterprise / MSVC v145 x64
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      PYTHON_VERSION: "3.14.2"
      VS_MODULE: "vs/2026/Enterprise"
      MSVC_MODULE: "msvc/v145_14.51.36231/x64"
      UCRT_MODULE: "ucrt/10.0.26100.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install WEMI runtime dependencies
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk `
            -Everything `
            -EverythingCli

      - name: Start Everything
        run: |
          .\.ci\common\start-everything.ps1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          github-token: ${{ github.token }}
          enable-cache: true
          cache-python: true

      - name: Configure, build and install WEMI
        run: |
          uv venv .venv `
            --python $env:PYTHON_VERSION `
            --seed

          . .\.venv\Scripts\Activate.ps1

          $InstallPrefix = "$env:RUNNER_TEMP\wemi-vs2026-msvc-v145"

          python.exe .\wemi.py `
            configure `
            --aio `
            --sdk='VS20XX;UCRT' `
            --prefix="$InstallPrefix"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "WEMI_MODULES_PREFIX=$InstallPrefix" >> $env:GITHUB_ENV

      - name: Validate VS2026 module stack
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          test-msvc `
            -Case Environment `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Test MSVC C language compile
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case C `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Test MSVC CXX language compile
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case CXX `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Test MSVC archive static linking
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case LIB `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Test MSVC DLL dynamic linking
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case DLL `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Test MSVC MASM assembling
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case ASM `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Test Windows Resource file compile
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case RC `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE
