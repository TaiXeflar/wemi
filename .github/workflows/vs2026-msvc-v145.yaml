name: VS2026 MSVC v145 Compile Smoke Test

on:
  push:
    branches:
      - master
    paths:
      # WEMI entry / core objects involved in module generation
      - "wemi.py"
      - "tasks/objects/modulesobject.py"

      # Visual Studio / UCRT detection
      # Replace these two with the actual paths in WEMI.
      - "path/to/FindVS20XX.py"
      - "path/to/FindUCRT.py"

      # If VS2026 itself has a dedicated SDK/profile definition,
      # add that exact file/directory here.
      - "SDKs/**/vs2026*"
      - "SDKs/**/VS2026*"

      # Shared CI support actually used by this test
      - ".ci/common/**"

      # Smoke-test implementation and source inputs
      - ".ci/sources/**"
      - ".ci/compile/test-msvc.psm1"

      # This workflow itself
      - ".github/workflows/vs2026-msvc-v145.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "wemi.py"
      - "tasks/objects/modulesobject.py"

      - "path/to/FindVS20XX.py"
      - "path/to/FindUCRT.py"

      - "SDKs/**/vs2026*"
      - "SDKs/**/VS2026*"

      - ".ci/common/**"
      - ".ci/sources/**"
      - ".ci/compile/test-msvc.psm1"

      - ".github/workflows/vs2026-msvc-v145.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs2026-msvc-v145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-test:
    name: VS2026 MSVC v145
    runs-on: windows-2025
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------
      # Common dependencies
      # ----------------------------------------------------------

      - name: Install Tcl/Tk
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk

      - name: Install Everything
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -Everything

      - name: Install Everything CLI
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -EverythingCli

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          github-token: ${{ github.token }}
          enable-cache: true
          cache-python: true

      # ----------------------------------------------------------
      # WEMI / Modules
      # ----------------------------------------------------------

      - name: Build VS2026 module with WEMI
        run: |
          # Replace this block with the exact command you currently use
          # to scan/configure/build/install the VS2026 module.
          #
          # Example shape only:
          #
          # uv run python .\wemi.py configure ...
          # uv run python .\wemi.py build ...
          # uv run python .\wemi.py install ...
          #
          # Do not move this logic into test-msvc.psm1.
          throw "Insert current WEMI VS2026 module build commands here."

      - name: Initialize Environment Modules support
        run: |
          # Replace this with your actual Modules support initialization.
          #
          # If initialization only modifies the current pwsh process,
          # each compile-test step should initialize/import it again
          # inside test-msvc.psm1 rather than relying on this step's
          # process environment.
          throw "Insert current Modules initialization commands here."

      # ----------------------------------------------------------
      # Toolchain visibility
      # ----------------------------------------------------------

      - name: Verify VS2026 toolchain discovery
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcEnvironment

      # ----------------------------------------------------------
      # Compile smoke tests
      # ----------------------------------------------------------

      - name: C language - compile, link and execute
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcC

      - name: C++ language - compile, link and execute
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcCxx

      - name: Static library - compile, archive, link and execute
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcStaticLibrary

      - name: Dynamic library - compile, link and execute
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcDynamicLibrary

      - name: MASM - assemble, link and execute
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcMasm

      - name: Resource Compiler - compile resource
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          Test-MsvcResource
