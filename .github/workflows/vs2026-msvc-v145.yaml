name: VS2026 MSVC v145 Compile Smoke Test

on:
  push:
    branches:
      - master
    paths:
      # VS2026 / UCRT detection and generated module templates.
      - "SDKs/**VS20XX*"
      - "SDKs/**UCRT*"
      - "include/template_VS20XX*"
      - "include/template_ucrt*"

      # Shared WEMI module generation / installation infrastructure.
      - "tasks/**"
      - "utils/**"
      - "wemi.py"

      # CI support and smoke-test sources.
      - ".ci/common/**"
      - ".ci/compile/**"
      - ".ci/sources/**"

      # This workflow.
      - ".github/workflows/vs2026-msvc-v145.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "SDKs/**VS20XX*"
      - "SDKs/**UCRT*"
      - "include/template_VS20XX*"
      - "include/template_ucrt*"
      - "tasks/**"
      - "utils/**"
      - "wemi.py"
      - ".ci/common/**"
      - ".ci/compile/**"
      - ".ci/sources/**"
      - ".github/workflows/vs2026-msvc-v145.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs2026-msvc-v145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-test:
    name: VS2026 Enterprise / MSVC v145 x64
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      PYTHON_VERSION: "3.14.2"

      # Generated by FindVS20XX:
      VS_MODULE: "vs/2026/Enterprise"
      MSVC_MODULE: "msvc/v145_14.51.36231/x64"

      # Generated by FindUCRT and exposed after loading the x64 MSVC module:
      UCRT_MODULE: "ucrt/10.0.26100.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # WEMI runtime dependencies
      # ------------------------------------------------------------

      - name: Install Tcl/Tk
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk

      - name: Install Everything
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -Everything

      - name: Install Everything CLI
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -EverythingCli

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          github-token: ${{ github.token }}
          enable-cache: true
          cache-python: true

      # ------------------------------------------------------------
      # Build WEMI module tree
      # ------------------------------------------------------------

      - name: Prepare WEMI Python environment
        run: |
          Import-Module `
            .\.ci\common\prepare-uv-venv.psm1 `
            -Force

          set-uvpython `
            -RepositoryRoot "${{ github.workspace }}" `
            -PythonVersion $env:PYTHON_VERSION

      - name: Build and install VS2026 and UCRT modules
        run: |
          $RepositoryRoot = "${{ github.workspace }}"
          $InstallPrefix = Join-Path `
            $env:RUNNER_TEMP `
            "wemi-vs2026-msvc-v145"

          $Python = Join-Path `
            $RepositoryRoot `
            ".venv\Scripts\python.exe"

          Remove-Item `
            -LiteralPath (Join-Path $RepositoryRoot "build") `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath $InstallPrefix `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          & $Python `
            (Join-Path $RepositoryRoot "wemi.py") `
            configure `
            --modules-only `
            --aio `
            --sdk VS20XX UCRT `
            --prefix $InstallPrefix

          if ($LASTEXITCODE -ne 0) {
            throw "WEMI failed to configure/build/install VS20XX and UCRT modules."
          }

          $InitScript = Join-Path `
            $InstallPrefix `
            "init\pwsh.ps1"

          if (-not (
            Test-Path `
              -LiteralPath $InitScript `
              -PathType Leaf
          )) {
            throw "Environment Modules initialization script was not installed: $InitScript"
          }

          "WEMI_MODULES_PREFIX=$InstallPrefix" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # Verify the exact generated module hierarchy
      # ------------------------------------------------------------

      - name: Validate VS2026 module stack
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load $env:VS_MODULE
          module load $env:MSVC_MODULE
          module load $env:UCRT_MODULE

          module list

          Get-Command cl.exe -ErrorAction Stop
          Get-Command link.exe -ErrorAction Stop
          Get-Command lib.exe -ErrorAction Stop
          Get-Command ml64.exe -ErrorAction Stop
          Get-Command rc.exe -ErrorAction Stop

      # ------------------------------------------------------------
      # Compile smoke tests
      #
      # Each `run` step is a new PowerShell process, so Environment Modules
      # support and the exact module stack are initialized again explicitly.
      # ------------------------------------------------------------

      - name: C language - compile, link and execute
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load $env:VS_MODULE
          module load $env:MSVC_MODULE
          module load $env:UCRT_MODULE

          test-msvc-cc

      - name: C++ language - compile, link and execute
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load $env:VS_MODULE
          module load $env:MSVC_MODULE
          module load $env:UCRT_MODULE

          test-msvc-cxx

      - name: MASM x64 - assemble, link and execute
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load $env:VS_MODULE
          module load $env:MSVC_MODULE
          module load $env:UCRT_MODULE

          test-ml64

      - name: Windows Resource Compiler - compile resource
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load $env:VS_MODULE
          module load $env:MSVC_MODULE
          module load $env:UCRT_MODULE

          test-rc
