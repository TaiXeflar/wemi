name: VS2026 MSVC v145 Compile Smoke Test

on:
  push:
    branches:
      - master
    paths:
      - "SDKs/**/*VS20XX*"
      - "SDKs/**/*UCRT*"
      - "include/**/*VS20XX*"
      - "include/**/*ucrt*"
      - "devices/**"
      - "tasks/**"
      - "utils/**"
      - "wemi.py"
      - ".ci/common/**"
      - ".ci/compile/**"
      - ".ci/sources/**"
      - ".github/workflows/vs2026-msvc-v145.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "SDKs/**/*VS20XX*"
      - "SDKs/**/*UCRT*"
      - "include/**/*VS20XX*"
      - "include/**/*ucrt*"
      - "devices/**"
      - "tasks/**"
      - "utils/**"
      - "wemi.py"
      - ".ci/common/**"
      - ".ci/compile/**"
      - ".ci/sources/**"
      - ".github/workflows/vs2026-msvc-v145.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs2026-msvc-v145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-test:
    name: VS2026 Enterprise / MSVC v145 x64
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      PYTHON_VERSION: "3.14.2"
      VS_MODULE: "vs/2026/Enterprise"
      MSVC_MODULE: "msvc/v145_14.51.36231/x64"
      UCRT_MODULE: "ucrt/10.0.26100.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install WEMI runtime dependencies
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk `
            -Everything `
            -EverythingCli

      - name: Start Everything
        run: |
          .\.ci\common\start-everything.ps1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          github-token: ${{ github.token }}
          enable-cache: true
          cache-python: true

      - name: Configure, build and install WEMI
        run: |
          $RepositoryRoot = "${{ github.workspace }}"
          $InstallPrefix = Join-Path `
            $env:RUNNER_TEMP `
            "wemi-vs2026-msvc-v145"

          Set-Location $RepositoryRoot

          Import-Module `
            .\.ci\common\prepare-uv-venv.psm1 `
            -Force

          set-uvpython `
            -RepositoryRoot $RepositoryRoot `
            -PythonVersion $env:PYTHON_VERSION

          $Python = Join-Path `
            $RepositoryRoot `
            ".venv\Scripts\python.exe"

          Remove-Item `
            -LiteralPath (Join-Path $RepositoryRoot "build") `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath $InstallPrefix `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          & $Python `
            (Join-Path $RepositoryRoot "wemi.py") `
            configure `
            --aio `
            --sdk='VS20XX;UCRT' `
            --prefix $InstallPrefix

          if ($LASTEXITCODE -ne 0) {
            throw "WEMI configure/build/install failed."
          }

          $RequiredFiles = @(
            (Join-Path $InstallPrefix "init\pwsh.ps1"),
            (Join-Path $InstallPrefix "modulefiles\vs\2026\Enterprise"),
            (Join-Path $InstallPrefix "modulefiles\.deps\2026\Enterprise\msvc\v145_14.51.36231\x64"),
            (Join-Path $InstallPrefix "modulefiles\.deps\winsdk\x64\ucrt\10.0.26100.0")
          )

          foreach ($File in $RequiredFiles) {
            if (-not (
              Test-Path `
                -LiteralPath $File `
                -PathType Leaf
            )) {
              throw "Expected WEMI output was not installed: $File"
            }
          }

          "WEMI_MODULES_PREFIX=$InstallPrefix" >> $env:GITHUB_ENV

      - name: Validate VS2026 module stack
        run: |
          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          test-msvc `
            -Case Environment `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: C language - compile, link and execute
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case C `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: C++ language - compile, link and execute
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case CXX `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Static library - compile and archive
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case LIB `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Dynamic library - compile and link
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case DLL `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: MASM x64 - assemble, link and execute
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case ASM `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE

      - name: Windows Resource Compiler - compile resource
        run: |
          Import-Module .\.ci\compile\test-msvc.psm1 -Force

          test-msvc `
            -Case RC `
            -InstallPrefix $env:WEMI_MODULES_PREFIX `
            -VisualStudioModule $env:VS_MODULE `
            -MsvcModule $env:MSVC_MODULE `
            -UcrtModule $env:UCRT_MODULE
