name: VS2026 MSVC v145 Compile Smoke Test

on:
  push:
    branches:
      - master
    paths:
      # Visual Studio / UCRT detection and their shared implementation.
      - "SDKs/**VS20XX*"
      - "SDKs/**UCRT*"

      # Module generation/install pipeline.
      - "tasks/**"
      - "include/**"

      # Windows detection infrastructure used by these detectors.
      - "devices/windows*"
      - "utils/**"

      # WEMI entry point.
      - "wemi.py"

      # CI implementation and smoke sources.
      - ".ci/common/**"
      - ".ci/compile/**"
      - ".ci/sources/**"

      # This workflow itself.
      - ".github/workflows/vs2026-msvc-v145.yaml"

  pull_request:
    branches:
      - master
    paths:
      - "SDKs/**VS20XX*"
      - "SDKs/**UCRT*"
      - "tasks/**"
      - "include/**"
      - "devices/windows*"
      - "utils/**"
      - "wemi.py"
      - ".ci/common/**"
      - ".ci/compile/**"
      - ".ci/sources/**"
      - ".github/workflows/vs2026-msvc-v145.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs2026-msvc-v145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-smoke-test:
    name: VS2026 / MSVC v145
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Common WEMI dependencies
      # ------------------------------------------------------------

      - name: Install Tcl/Tk
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk

      - name: Install Everything
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -Everything

      - name: Install Everything CLI
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -EverythingCli

      - name: Start Everything
        run: |
          .\.ci\common\start-everything.ps1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.2"
          github-token: ${{ github.token }}
          enable-cache: true
          cache-python: true

      # ------------------------------------------------------------
      # WEMI build
      # ------------------------------------------------------------

      - name: Prepare WEMI Python environment
        run: |
          Import-Module `
            .\.ci\common\prepare-uv-venv.psm1 `
            -Force

          set-uvpython `
            -RepositoryRoot "${{ github.workspace }}" `
            -PythonVersion "3.14.2"

      - name: Build and install WEMI Modules
        run: |
          $RepositoryRoot = "${{ github.workspace }}"
          $InstallPrefix = Join-Path $env:RUNNER_TEMP "wemi-vs2026-modules"
          $Python = Join-Path `
            $RepositoryRoot `
            ".venv\Scripts\python.exe"

          Remove-Item `
            -LiteralPath (Join-Path $RepositoryRoot "build") `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            -LiteralPath $InstallPrefix `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          & $Python `
            (Join-Path $RepositoryRoot "wemi.py") `
            configure `
            --aio `
            --sdk='VS20XX;UCRT' `
            --prefix $InstallPrefix

          if ($LASTEXITCODE -ne 0) {
            throw "WEMI failed to build/install VS2026 and UCRT modules."
          }

          if (-not (
              Test-Path `
                -LiteralPath $InstallPrefix `
                -PathType Container
          )) {
            throw "WEMI install prefix was not created: $InstallPrefix"
          }

          "WEMI_MODULES_PREFIX=$InstallPrefix" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # Environment Modules
      # ------------------------------------------------------------

      - name: Initialize Modules support
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          Get-Command module -ErrorAction Stop | Out-Null

          module --version

      # ------------------------------------------------------------
      # MSVC smoke tests
      # ------------------------------------------------------------

      - name: C language - compile, link and execute
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load vs/VS2026/Enterprise

          $MsvcModule = (
            module avail 2>&1 |
            Select-String 'msvc/.+\(145\)/x64' |
            Select-Object -First 1
          )

          if (-not $MsvcModule) {
            throw "MSVC v145 x64 module was not found."
          }

          $ModuleName = (
            $MsvcModule.ToString() -split '\s+'
          ) |
            Where-Object { $_ -match '^msvc/' } |
            Select-Object -First 1

          module load $ModuleName

          Test-Msvc-CC

      - name: C++ language - compile, link and execute
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load vs/VS2026/Enterprise

          $ModuleName = (
            module avail 2>&1 |
            Select-String 'msvc/.+\(145\)/x64' |
            Select-Object -First 1
          ).ToString().Split() |
            Where-Object { $_ -match '^msvc/' } |
            Select-Object -First 1

          module load $ModuleName

          Test-Msvc-CXX

      - name: MASM - assemble, link and execute
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load vs/VS2026/Enterprise

          $ModuleName = (
            module avail 2>&1 |
            Select-String 'msvc/.+\(145\)/x64' |
            Select-Object -First 1
          ).ToString().Split() |
            Where-Object { $_ -match '^msvc/' } |
            Select-Object -First 1

          module load $ModuleName

          Test-ML64

      - name: Resource Compiler - compile resource
        run: |
          Import-Module `
            .\.ci\common\modules-init.psm1 `
            -Force

          Import-Module `
            .\.ci\compile\test-msvc.psm1 `
            -Force

          init-modules `
            -InstallPrefix $env:WEMI_MODULES_PREFIX

          module load vs/VS2026/Enterprise

          $ModuleName = (
            module avail 2>&1 |
            Select-String 'msvc/.+\(145\)/x64' |
            Select-Object -First 1
          ).ToString().Split() |
            Where-Object { $_ -match '^msvc/' } |
            Select-Object -First 1

          module load $ModuleName

          Test-RC
