name: Sync to Gitea

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Asia/Taipei"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitea
  cancel-in-progress: false

jobs:
  mirror:
    name: Push mirror to Gitea
    uses: ./.github/workflows/_sync-repo.yaml

    with:
      host: gitea.com
      repository: TaiXeflar/wemi.git

    secrets:
      username: ${{ secrets.GITEA_USERNAME }}
      token: ${{ secrets.GITEA_SYNC_TOKEN }}
