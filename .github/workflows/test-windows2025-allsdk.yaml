name: All SDK Configure Observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Configure all SDK scanners
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Tcl/Tk
        shell: pwsh
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -TclTk

      - name: Install Everything
        shell: pwsh
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -Everything

      - name: Install Everything CLI
        shell: pwsh
        run: |
          .\.ci\common\install-windows-tools.ps1 `
            -EverythingCli

      # Patch: check why es.ese return error 8
      - name: Start Everything search client
        shell: pwsh
        run: |
          $EverythingCommand = Get-Command `
            Everything.exe `
            -CommandType Application `
            -ErrorAction SilentlyContinue

          if ($null -eq $EverythingCommand) {
            $Candidates = @(
              "$env:ProgramFiles\Everything\Everything.exe",
              "${env:ProgramFiles(x86)}\Everything\Everything.exe",
              "$env:LOCALAPPDATA\Everything\Everything.exe"
            )

            $EverythingPath = $Candidates |
              Where-Object {
                $_ -and (
                  Test-Path `
                    -LiteralPath $_ `
                    -PathType Leaf
                )
              } |
              Select-Object -First 1
          }
          else {
            $EverythingPath = $EverythingCommand.Source
          }

          if (-not $EverythingPath) {
            throw "Everything.exe was not found."
          }

          $EsPath = (
            Get-Command `
              es.exe `
              -CommandType Application `
              -ErrorAction Stop
          ).Source

          Write-Host "Everything: $EverythingPath"
          Write-Host "ES: $EsPath"

          Start-Process `
            -FilePath $EverythingPath `
            -ArgumentList "-startup" `
            -WindowStyle Hidden

          $Ready = $false

          for ($Attempt = 1; $Attempt -le 20; $Attempt++) {
            & $EsPath `
              -timeout 1000 `
              -get-everything-version

            if ($LASTEXITCODE -eq 0) {
              $Ready = $true
              break
            }

            Write-Host (
              "Waiting for Everything IPC, " +
              "attempt $Attempt, exit code $LASTEXITCODE"
            )

            Start-Sleep -Milliseconds 500
          }

          Get-Process Everything `
            -ErrorAction SilentlyContinue |
            Format-Table `
              Id, `
              SessionId, `
              Path

          if (-not $Ready) {
            throw (
              "Everything IPC did not become ready. " +
              "Last ES exit code: $LASTEXITCODE"
            )
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          github-token: ${{ github.token }}

      - name: Run all SDK configure
        shell: pwsh
        run: |
          .\.ci\windows-2025-obs.ps1 `
            -RepositoryRoot "${{ github.workspace }}" `
            -PythonVersion "3.14"
